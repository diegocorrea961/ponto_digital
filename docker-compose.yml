# Banco PostgreSQL para desenvolvimento local:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      POSTGRES_DB: ponto
    ports:
      # Só a própria máquina acessa o banco. Sem o 127.0.0.1, no Windows/Docker Desktop a porta
      # abriria para toda a rede (wi-fi), e a senha deste banco de desenvolvimento é "ponto".
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
